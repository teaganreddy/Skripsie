; PlatformIO Project Configuration File
;
; fan_controller -- stator-side firmware for the hologram fan display.
; Motor control + WiFi AP + web server on a single-core ESP32-C6.
;
; Copied from motor_test, which stays untouched as the known-good motor
; reference to fall back on.

; ---------------------------------------------------------------------------
;  ONE SOURCE TREE, TWO UNITS
; ---------------------------------------------------------------------------
; Unit 1's stator is the MASTER (access point, website, content library).
; Unit 2's stator is a PEER: same firmware, -DUNIT_ID=2, no AP, own FOC loop
; and rotor link, commanded by the master over ESP-NOW. Flash with:
;     pio run -e unit1 --target upload      (and -t uploadfs for the website)
;     pio run -e unit2 --target upload      (and -t uploadfs for the PRESETS)
; A plain `pio run` builds unit1. Both units need the filesystem: the peer
; serves nothing, but its rotor's presets come off its own flash.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    askuric/Simple FOC @ ^2.3.4
    ; The maintained ESP32Async forks, not the original me-no-dev versions --
    ; those predate the C6 and do not handle a RISC-V target correctly.
    ; ESPAsyncWebServer is what gives us AsyncEventSource (SSE), which the
    ; website's telemetry channel depends on.
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; AsyncTCP runs its callbacks on its own task. Keeping that task's
    ; priority below the FOC task is the whole point of the design (see the
    ; task-priority block in main.cpp), so pin it explicitly rather than
    ; inheriting whatever the library's default happens to be this release.
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

[env:unit1]
build_flags = ${env.build_flags} -D UNIT_ID=1

[env:unit2]
; Normal direction. Reversing fan 2 (-D MOTOR_DIRECTION=-1, tried 2026-09-29
; against carriage vibration) made it strain and latch E09 near 500 rpm while
; fan 1 reached 600, so it was taken back out on 2026-10-01. The flag still
; works if counter-rotation is ever wanted, but measure the electrical zero
; for that direction first.
build_flags = ${env.build_flags} -D UNIT_ID=2

; Kept so existing scripts naming the old environment still work (unit 1).
[env:dfrobot_firebeetle2_esp32c6]
build_flags = ${env.build_flags} -D UNIT_ID=1
