; PlatformIO Project Configuration File
;
; rotor_controller -- rotor-side firmware for the hologram fan display.
; ESP32-S3 on the rotating arm: APA102 strip + Hall angular reference, and
; (stage 2b) the ESP-NOW link back to the C6 stator.
;
; LED_Test and hall_effect_sensor stay untouched as known-good references.

; ---------------------------------------------------------------------------
;  ONE SOURCE TREE, TWO UNITS
; ---------------------------------------------------------------------------
; The only difference between unit 1's rotor and unit 2's is -DUNIT_ID, which
; decides which stator's beacon it answers. Flash with:
;     pio run -e unit1 --target upload
;     pio run -e unit2 --target upload
; A plain `pio run` builds unit1. Flashing the wrong one onto a board is a
; silent mistake -- the boot banner prints the unit number in capitals, and
; the rotor will pair with the other fan's stator, which the website shows.

[env]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
; Native USB: the monitor's DTR/RTS toggle can drop the S3 into the bootloader
; (CLAUDE.md gotcha 44). Keep both lines low.
monitor_dtr = 0
monitor_rts = 0
; PSRAM / flash overrides -- see the long note further down for why.
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =

; SECTOR_OFFSET / SECTOR_REVERSE: per-unit angle calibration (see config.h).
; Calibrated from the website's Diagnostics tab with the Calibrate preset; the
; master stator holds the values and sends them in every command. These are
; only the defaults used before this rotor has paired.
[env:unit1]
build_flags = ${common.build_flags} -D UNIT_ID=1 -D SECTOR_OFFSET=0 -D SECTOR_REVERSE=0

[env:unit2]
; NEW STRIP fitted 2026-10-01 (the old one was dead, see CLAUDE.md section 3),
; tested and verified working by Teagan:
;   34 LEDs, 17 per arm, NO LED at the hub (the hub sits between the two
;   middle LEDs, as config.h's LEDS_TOTAL note assumes). 18-radial content is
;   resampled onto the 17-LED arm.
;   strip data   -> GPIO15 (MOSI)  default, back from A0/GPIO4
;   strip clock  -> GPIO17 (SCK)   default, back from D14/GPIO47
;   Hall sensor  -> D11 = GPIO13   unchanged: GPIO14/D10 on this S3 is dead
;                                  (reads 0.09 V as a pulled-up input)
; The earlier moves (clock 17 -> 12 -> 47, data 15 -> 4) were chasing the
; dead strip; with the new strip the default SPI pins work.
build_flags = ${common.build_flags} -D UNIT_ID=2 -D LEDS_TOTAL=34 -D SECTOR_OFFSET=0 -D SECTOR_REVERSE=0 -D PIN_HALL_GPIO=13

; Kept so existing scripts that name the old environment still work (unit 1).
[env:dfrobot_firebeetle2_esp32s3]
build_flags = ${common.build_flags} -D UNIT_ID=1

[common]
; Native USB CDC, matching both existing S3 test projects.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    ; Without this the Arduino core never calls psramInit(), so ESP.getPsramSize()
    ; returns 0 even on a board that physically has PSRAM. The DFRobot board
    ; definition does not set it -- it describes the base N4 variant.
    -D BOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
;  PSRAM / FLASH -- the board definition is wrong for this unit, on purpose
; ---------------------------------------------------------------------------
; esptool reads the real hardware as:
;     Embedded PSRAM 8MB (AP_3v3),  flash 16MB       -> this is the N16R8
; while boards/dfrobot_firebeetle2_esp32s3.json declares 4MB flash, no PSRAM
; and flash_mode qio. All three have to be overridden here.
;
; memory_type picks a precompiled Arduino library variant by DIRECTORY NAME,
; and only these exist:  dio_opi, dio_qspi, opi_opi
; -- there is no qio_opi. Setting one silently selects a path that does not
; exist and you fall back to a build with no PSRAM support, which is exactly
; what happened on the first run: 8 MB of PSRAM present, ESP.getPsramSize()
; reporting 0.
;
; dio_opi = DIO flash + OPI (octal) PSRAM, which is the S3R8 arrangement. The
; octal PSRAM shares pins with the flash interface, so the flash runs DIO
; rather than QIO -- hence the flash_mode override too.
; (These live under [env] at the top so every environment gets them.)

; No pre-built LED library -- FR12 requires the display driver to be custom,
; and independently Adafruit_DotStar cannot do this job: show() blocks and
; offers no way to hit a 476 us column cadence. See apa102.h.
