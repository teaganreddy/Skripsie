; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dfrobot_firebeetle2_esp32s3]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
upload_protocol = esptool

; WROOM-1-N16R8 uses Octal (OPI) PSRAM; without telling the core, PSRAM init
; can default to quad-mode and crash/reset the chip before setup() runs.
board_build.arduino.memory_type = qio_opi

; This board's definition omits ARDUINO_USB_CDC_ON_BOOT, so without this flag
; Serial binds to UART0 (not wired to the USB-C port) instead of native USB,
; and nothing shows up in the serial monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
