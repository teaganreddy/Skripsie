; PlatformIO Project Configuration File
;
; fan_controller -- stator-side firmware for the hologram fan display.
; Motor control + WiFi AP + web server on a single-core ESP32-C6.
;
; Copied from motor_test, which stays untouched as the known-good motor
; reference to fall back on.

[env:dfrobot_firebeetle2_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    askuric/Simple FOC @ ^2.3.4
    ; The maintained ESP32Async forks, not the original me-no-dev versions --
    ; those predate the C6 and do not handle a RISC-V target correctly.
    ; ESPAsyncWebServer is what gives us AsyncEventSource (SSE), which the
    ; website's telemetry channel depends on.
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; AsyncTCP runs its callbacks on its own task. Keeping that task's
    ; priority below the FOC task is the whole point of the design (see the
    ; task-priority block in main.cpp), so pin it explicitly rather than
    ; inheriting whatever the library's default happens to be this release.
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
