; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dfrobot_firebeetle2_esp32c6]
platform = espressif32
board = dfrobot_firebeetle2_esp32c6
framework = arduino
upload_protocol = esptool
monitor_speed = 115200

; The C6's USB port is the chip's native USB-Serial-JTAG, not a UART bridge.
; PlatformIO's monitor asserts DTR/RTS when it opens the port, which the
; USB-Serial-JTAG peripheral interprets as a reset/bootloader request -- the
; chip can end up held in the download bootloader, so nothing runs and
; nothing prints. Leave both lines de-asserted.
monitor_dtr = 0
monitor_rts = 0

; Unlike the FireBeetle 2 ESP32-S3 board definition, this board's definition
; already sets ARDUINO_USB_CDC_ON_BOOT and ARDUINO_USB_MODE, so native USB
; serial works out of the box -- no extra build_flags needed here.
