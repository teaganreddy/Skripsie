; rail_controller -- linear rail, DFRobot FireBeetle 2 ESP32-C6
;
; Carried over from linear_rail_test/platformio.ini, which is the bring-up
; sketch this project replaces. Build and flash with PlatformIO's penv (it is
; not on PATH):
;     ~/.platformio/penv/bin/pio run --target upload

[env:dfrobot_firebeetle2_esp32c6]
platform = espressif32
board = dfrobot_firebeetle2_esp32c6
framework = arduino
upload_protocol = esptool
monitor_speed = 115200

; The C6's USB port is the chip's native USB-Serial-JTAG, not a UART bridge.
; PlatformIO's monitor asserts DTR/RTS when it opens the port, which the
; USB-Serial-JTAG peripheral interprets as a reset/bootloader request -- the
; chip can end up held in the download bootloader, so nothing runs and
; nothing prints. Leave both lines de-asserted.
monitor_dtr = 0
monitor_rts = 0

; This board's definition already sets ARDUINO_USB_CDC_ON_BOOT and
; ARDUINO_USB_MODE, so native USB serial works without extra build_flags.
